<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 916" width="1440" height="1374" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F6E66"/>
    </marker>
    <marker id="mq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9C4A22"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="916" fill="#FFFFFF"/>
  <text x="14" y="24" font-size="13" font-weight="700" fill="#1B1F27">Sequence — one image through indexing, one image through query</text>

  <g transform="translate(0,36)">
    <rect x="14" y="14" width="104" height="34" rx="5" fill="#FFFFFF" stroke="#1B1F27" stroke-width="1.4"/>
    <text x="66" y="35" font-size="11" font-weight="600" fill="#1B1F27" text-anchor="middle">Admin / Shopper</text>
    <rect x="140" y="14" width="104" height="34" rx="5" fill="#FFFFFF" stroke="#1B1F27" stroke-width="1.4"/>
    <text x="192" y="35" font-size="12" font-weight="600" fill="#1B1F27" text-anchor="middle">Storefront</text>
    <rect x="278" y="14" width="104" height="34" rx="5" fill="#FFFFFF" stroke="#1B1F27" stroke-width="1.4"/>
    <text x="330" y="35" font-size="12" font-weight="600" fill="#1B1F27" text-anchor="middle">Server</text>
    <rect x="418" y="14" width="104" height="34" rx="5" fill="#FFFFFF" stroke="#1B1F27" stroke-width="1.4"/>
    <text x="470" y="35" font-size="12" font-weight="600" fill="#1B1F27" text-anchor="middle">Worker</text>
    <rect x="558" y="14" width="104" height="34" rx="5" fill="#FFFFFF" stroke="#1B1F27" stroke-width="1.4"/>
    <text x="610" y="35" font-size="12" font-weight="600" fill="#1B1F27" text-anchor="middle">Embedder</text>
    <rect x="698" y="14" width="104" height="34" rx="5" fill="#FFFFFF" stroke="#1B1F27" stroke-width="1.4"/>
    <text x="750" y="35" font-size="12" font-weight="600" fill="#1B1F27" text-anchor="middle">Postgres</text>
    <rect x="838" y="14" width="104" height="34" rx="5" fill="#FFFFFF" stroke="#1B1F27" stroke-width="1.4"/>
    <text x="890" y="35" font-size="12" font-weight="600" fill="#1B1F27" text-anchor="middle">R2</text>

    <line x1="66"  y1="48" x2="66"  y2="852" stroke="#D6DBE3" stroke-width="1.1" stroke-dasharray="3 4"/>
    <line x1="192" y1="48" x2="192" y2="852" stroke="#D6DBE3" stroke-width="1.1" stroke-dasharray="3 4"/>
    <line x1="330" y1="48" x2="330" y2="852" stroke="#D6DBE3" stroke-width="1.1" stroke-dasharray="3 4"/>
    <line x1="470" y1="48" x2="470" y2="852" stroke="#D6DBE3" stroke-width="1.1" stroke-dasharray="3 4"/>
    <line x1="610" y1="48" x2="610" y2="852" stroke="#D6DBE3" stroke-width="1.1" stroke-dasharray="3 4"/>
    <line x1="750" y1="48" x2="750" y2="852" stroke="#D6DBE3" stroke-width="1.1" stroke-dasharray="3 4"/>
    <line x1="890" y1="48" x2="890" y2="852" stroke="#D6DBE3" stroke-width="1.1" stroke-dasharray="3 4"/>

    <text x="14" y="78" font-size="10.5" letter-spacing="1" font-weight="700" fill="#0F6E66">INDEXING — BUILDS THE VECTORS</text>
    <line x1="14" y1="86" x2="946" y2="86" stroke="#0F6E66" stroke-width="1.3" stroke-dasharray="2 3"/>

    <text x="14" y="116" font-size="9.5" fill="#5B6472">1</text>
    <line x1="66" y1="120" x2="326" y2="120" stroke="#0F6E66" stroke-width="1.3" marker-end="url(#mi)"/>
    <text x="196" y="113" font-size="10.5" fill="#0F6E66" text-anchor="middle">reindexVisualSearch</text>

    <text x="14" y="156" font-size="9.5" fill="#5B6472">2</text>
    <line x1="330" y1="160" x2="606" y2="160" stroke="#0F6E66" stroke-width="1.3" marker-end="url(#mi)"/>
    <text x="468" y="153" font-size="10.5" fill="#0F6E66" text-anchor="middle">GET /health — forced refresh</text>

    <text x="14" y="196" font-size="9.5" fill="#5B6472">3</text>
    <line x1="610" y1="200" x2="334" y2="200" stroke="#0F6E66" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mi)"/>
    <text x="472" y="193" font-size="10.5" fill="#0F6E66" text-anchor="middle">revision, dim=512</text>

    <text x="14" y="236" font-size="9.5" fill="#5B6472">4</text>
    <line x1="330" y1="240" x2="746" y2="240" stroke="#0F6E66" stroke-width="1.3" marker-end="url(#mi)"/>
    <text x="538" y="233" font-size="10.5" fill="#0F6E66" text-anchor="middle">INSERT jobs — 32 products each</text>

    <text x="14" y="276" font-size="9.5" fill="#5B6472">5</text>
    <line x1="470" y1="280" x2="746" y2="280" stroke="#0F6E66" stroke-width="1.3" marker-end="url(#mi)"/>
    <text x="608" y="273" font-size="10.5" fill="#0F6E66" text-anchor="middle">poll queue — concurrency 4</text>

    <text x="14" y="316" font-size="9.5" fill="#5B6472">6</text>
    <line x1="470" y1="320" x2="886" y2="320" stroke="#0F6E66" stroke-width="1.3" marker-end="url(#mi)"/>
    <text x="678" y="313" font-size="10.5" fill="#0F6E66" text-anchor="middle">GET source bytes, per asset</text>

    <text x="14" y="356" font-size="9.5" fill="#5B6472">7</text>
    <line x1="470" y1="360" x2="606" y2="360" stroke="#0F6E66" stroke-width="1.3" marker-end="url(#mi)"/>
    <text x="538" y="353" font-size="10.5" fill="#0F6E66" text-anchor="middle">POST /embed/images ×32</text>

    <text x="14" y="400" font-size="9.5" fill="#5B6472">8</text>
    <polyline points="610,388 664,388 664,420 614,420" fill="none" stroke="#0F6E66" stroke-width="1.3" marker-end="url(#mi)"/>
    <text x="674" y="383" font-size="10.5" fill="#0F6E66">preprocess → ViT-B/32 → L2 normalize</text>

    <text x="14" y="452" font-size="9.5" fill="#5B6472">9</text>
    <line x1="610" y1="456" x2="474" y2="456" stroke="#0F6E66" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mi)"/>
    <text x="542" y="449" font-size="10.5" fill="#0F6E66" text-anchor="middle">512-d unit vectors</text>

    <text x="14" y="492" font-size="9.5" fill="#5B6472">10</text>
    <line x1="470" y1="496" x2="746" y2="496" stroke="#0F6E66" stroke-width="1.3" marker-end="url(#mi)"/>
    <text x="608" y="489" font-size="10.5" fill="#0F6E66" text-anchor="middle">DELETE old · INSERT vector + revision</text>

    <text x="14" y="552" font-size="10.5" letter-spacing="1" font-weight="700" fill="#9C4A22">QUERY — READS THEM BACK</text>
    <line x1="14" y1="560" x2="946" y2="560" stroke="#9C4A22" stroke-width="1.3" stroke-dasharray="2 3"/>

    <text x="14" y="592" font-size="9.5" fill="#5B6472">11</text>
    <line x1="66" y1="596" x2="188" y2="596" stroke="#9C4A22" stroke-width="1.3" marker-end="url(#mq)"/>
    <text x="127" y="589" font-size="10.5" fill="#9C4A22" text-anchor="middle">upload photo</text>

    <text x="14" y="632" font-size="9.5" fill="#5B6472">12</text>
    <line x1="192" y1="636" x2="326" y2="636" stroke="#9C4A22" stroke-width="1.3" marker-end="url(#mq)"/>
    <text x="259" y="629" font-size="10.5" fill="#9C4A22" text-anchor="middle">searchByImage(base64)</text>

    <text x="14" y="672" font-size="9.5" fill="#5B6472">13</text>
    <line x1="330" y1="676" x2="606" y2="676" stroke="#9C4A22" stroke-width="1.3" marker-end="url(#mq)"/>
    <text x="468" y="669" font-size="10.5" fill="#9C4A22" text-anchor="middle">POST /embed/images — 1 image</text>

    <text x="14" y="712" font-size="9.5" fill="#5B6472">14</text>
    <line x1="610" y1="716" x2="334" y2="716" stroke="#9C4A22" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mq)"/>
    <text x="472" y="709" font-size="10.5" fill="#9C4A22" text-anchor="middle">512-d unit vector</text>

    <text x="14" y="752" font-size="9.5" fill="#5B6472">15</text>
    <line x1="330" y1="756" x2="746" y2="756" stroke="#9C4A22" stroke-width="1.3" marker-end="url(#mq)"/>
    <text x="538" y="749" font-size="10.5" fill="#9C4A22" text-anchor="middle">ORDER BY embedding &lt;=&gt; $1 WHERE revision = current</text>

    <text x="14" y="792" font-size="9.5" fill="#5B6472">16</text>
    <line x1="750" y1="796" x2="334" y2="796" stroke="#9C4A22" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mq)"/>
    <text x="542" y="789" font-size="10.5" fill="#9C4A22" text-anchor="middle">nearest products + distance, via HNSW</text>

    <text x="14" y="832" font-size="9.5" fill="#5B6472">17</text>
    <line x1="330" y1="836" x2="196" y2="836" stroke="#9C4A22" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mq)"/>
    <text x="263" y="829" font-size="10.5" fill="#9C4A22" text-anchor="middle">items + revision</text>
  </g>
</svg>
